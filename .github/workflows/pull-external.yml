name: Pull external account (targeted)

on:
  workflow_dispatch:
    inputs:
      riot_id:
        description: 'Riot ID, e.g. "Duckies Kingdom#5693"'
        required: true
      region:
        description: "na, oce, euw, ..."
        default: "na"

permissions:
  contents: write

# Shares the pull-ranks group so it never races the regular sweep.
concurrency:
  group: pull-ranks
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull ranked games
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: |
          python3 scripts/pull_external.py --riot-id "${{ inputs.riot_id }}" --region "${{ inputs.region }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/external/
          git diff --cached --quiet && { echo "No new games"; exit 0; }
          git commit -m "External pull: ${{ inputs.riot_id }} (${{ inputs.region }})"
          git push
