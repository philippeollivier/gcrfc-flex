name: Pull ranks

on:
  schedule:
    # Daily at 14:00 UTC (07:00 Pacific). GitHub may delay cron by minutes.
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull ranks and matches from the Riot API
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: |
          python3 scripts/pull_ranks.py
          python3 scripts/pull_matches.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && { echo "No new rows"; exit 0; }
          git commit -m "Ranks and matches $(date -u +%F)"
          git push
