name: Pull ranks

on:
  schedule:
    # Every 30 minutes. GitHub may delay or occasionally skip scheduled runs.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never run two pulls at once (a long backfill could overlap the next cron tick).
concurrency:
  group: pull-ranks
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull ranks and matches from the Riot API
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: |
          python3 scripts/pull_ranks.py
          python3 scripts/pull_matches.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && { echo "No new rows"; exit 0; }
          git commit -m "Ranks and matches $(date -u '+%F %H:%M') UTC"
          git push
